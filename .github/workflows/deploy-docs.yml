name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxlint-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: docs-production
      url: https://oxlint.totto2727.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
        with:
          install-args: --frozen-lockfile
      - name: Validate and deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set docs-production CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set docs-production CLOUDFLARE_API_TOKEN secret'; exit 1; }
          vp run ci
          vp run deploy
      - name: Verify published documentation
        run: |
          curl_exit=0
          http_status="$(curl --fail-with-body --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 \
            -H 'Accept: text/html' https://oxlint.totto2727.dev/en/rules/require-import-extension \
            -D "$RUNNER_TEMP/oxlint-docs.headers" -o "$RUNNER_TEMP/oxlint-docs.html" \
            -w '%{http_code}')" || curl_exit=$?
          if [ "$curl_exit" -ne 0 ] || ! grep -q 'data-doc-page="/en/rules/require-import-extension"' "$RUNNER_TEMP/oxlint-docs.html"; then
            printf 'Public verification failed: curl exit=%s HTTP=%s\n' "$curl_exit" "$http_status"
            if [ -f "$RUNNER_TEMP/oxlint-docs.headers" ]; then
              { grep -iE '^(HTTP/|cf-ray:|cf-mitigated:|content-type:)' "$RUNNER_TEMP/oxlint-docs.headers" || true; } \
                | tail -n 12 | cut -c 1-512 | while IFS= read -r line; do printf 'public-response: %s\n' "$line"; done
            fi
            if [ -f "$RUNNER_TEMP/oxlint-docs.html" ]; then
              excerpt="$(head -c 2048 "$RUNNER_TEMP/oxlint-docs.html" | LC_ALL=C tr -cd '\11\12\15\40-\176' | tr '\r\n' ' ' | cut -c 1-512)"
              printf 'public-body (first 512 sanitized characters): %s\n' "$excerpt"
            fi
            exit 1
          fi
          echo '[Production documentation](https://oxlint.totto2727.dev)' >> "$GITHUB_STEP_SUMMARY"
