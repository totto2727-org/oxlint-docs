packages:
  - .

allowBuilds:
  workerd: true
  esbuild: true
  msgpackr-extract: false

# Enforce pnpm's default 24-hour release age without automatic exclusions.
minimumReleaseAgeStrict: true

# https://viteplus.dev/guide/local-cli#manual-installation
# Vite consumers share Vite+ core, and vp test shares its bundled Vitest.
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.1.0
  'vitest@*': 5.0.3
