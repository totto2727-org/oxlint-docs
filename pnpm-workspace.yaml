packages:
  - .

allowBuilds:
  workerd: true
  esbuild: true
  msgpackr-extract: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# TODO: Remove these user-authorized exceptions after 2026-11-09T16:30:51.871Z.
minimumReleaseAgeExclude:
  - '@effront/alchemy@0.4.0'
  - '@effront/core@0.4.0'
  - '@effront/markdown@0.4.0'
  - '@effront/tailwind@0.4.0'
  - '@effront/vite@0.4.0'

# https://viteplus.dev/guide/local-cli#manual-installation
# Match the installed Vite+ core and bundled Vitest exactly.
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.1.0
  'vitest@*': 5.0.3
